name: Add polymer to DB

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-polymer:
    if: contains(github.event.issue.labels.*.name, 'polymer-db')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse issue and update polymer_db.json
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/parse_polymer_issue.py

      - name: Regenerate polymer_db.js
        run: python3 .github/scripts/build_polymer_db.py

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: polymer-db/add-${{ github.event.issue.number }}
          base: main
          commit-message: "feat(polymer-db): add ${{ steps.parse.outputs.polymer_key }} (issue #${{ github.event.issue.number }})"
          title: "feat(polymer-db): add ${{ steps.parse.outputs.polymer_key }}"
          body: |
            自動生成 PR — Issue #${{ github.event.issue.number }} からの追加。

            **key**: `${{ steps.parse.outputs.polymer_key }}`
            **label**: `${{ steps.parse.outputs.polymer_label }}`

            マージすると `polymer_db.json` に新規エントリが追加されます。
            `polymer_db.js` は自動再生成済みです。

            Closes #${{ github.event.issue.number }}
          labels: |
            polymer-db
            auto-generated

      - name: Comment on issue with failure hint
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `⚠ PR 作成に失敗しました。フォーム入力を見直すか、ログを確認してください: ${runUrl}`
            });
