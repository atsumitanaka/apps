name: 📥 ポリマーDB追加リクエスト
description: polymer_db.json に新しいポリマー / モノマーを追加する
title: "[polymer-db] add: "
labels: ["polymer-db"]
body:
  - type: markdown
    attributes:
      value: |
        新しいポリマー / モノマーを内部 DB に追加するためのフォームです。
        入力を送信するとワークフローが PR を作成します。マージ後に反映されます。

        **必須**: key / label / displayName / SMILES
        SMILES は BigSMILES 記法（`[$]` = 結合点）を推奨。化合物 SMILES の場合は note に「化合物」と記載してください。

  - type: input
    id: key
    attributes:
      label: key（一意の短縮記号）
      description: 例 - `PPE` / `PSU` / `BHF`。既存の key と重複するとエラーになります。
      placeholder: 例 PES-a
    validations:
      required: true

  - type: input
    id: label
    attributes:
      label: label（ドロップダウン表示名）
      description: 形式 `<key>|<英名>` を推奨
      placeholder: 例 "PES-a|Poly(arylene ether sulfone) type-a"
    validations:
      required: true

  - type: input
    id: displayName
    attributes:
      label: displayName（正式名称）
      description: IUPAC名や慣用名
      placeholder: 例 "poly(oxy-1,4-phenylene-sulfonyl-1,4-phenylene)"
    validations:
      required: true

  - type: dropdown
    id: defaultClass
    attributes:
      label: defaultClass
      options:
        - Homopolymer
        - Copolymer
    validations:
      required: true

  - type: checkboxes
    id: dropdownHidden
    attributes:
      label: ドロップダウン表示
      options:
        - label: ドロップダウン非表示にする（検索でのみヒット。共モノマーや別名エントリ用）

  - type: input
    id: aliases
    attributes:
      label: aliases（別名・商品名 - カンマ区切り）
      description: 検索でヒットさせたい別名。空欄可
      placeholder: 例 "Udel, Polysulfone P-1700, PSF, Mindel"

  - type: textarea
    id: elements
    attributes:
      label: elements（繰り返し単位 - JSON配列）
      description: |
        単一の場合も配列で入力してください。フィールド: name / smiles / polyGroup / note
        SMILES 中の `[$]` はそのまま貼り付け可（YAML パーサーは通ります）。
      value: |
        [
          {
            "name": "",
            "smiles": "",
            "polyGroup": "",
            "note": ""
          }
        ]
      render: json
    validations:
      required: true

  - type: textarea
    id: monomers
    attributes:
      label: monomers（構成モノマー - JSON配列、任意）
      description: |
        このポリマーを構成する原料モノマー（化合物SMILES）。空欄可。
        フィールド - name / smiles / role
      value: |
        []
      render: json

  - type: textarea
    id: references
    attributes:
      label: 参考文献 / 出典（任意）
      description: DOI・URL・書籍名など。PR の説明欄に付加されます。
