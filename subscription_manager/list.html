<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サブスクリプション一覧</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0; padding: 24px 16px; background: #f5f5f7; color: #1d1d1f;
    font-size: 15px; line-height: 1.6;
    max-width: 1080px; margin-left: auto; margin-right: auto;
  }
  header { margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 4px 0; }
  .subtitle { color: #666; font-size: 13px; }
  .back { display: inline-block; margin-bottom: 12px; color: #007aff; text-decoration: none; font-size: 13px; }
  .back:hover { text-decoration: underline; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat {
    background: white;
    padding: 16px 18px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .stat .label { color: #666; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; color: #1d1d1f; }
  .stat .value.due { color: #ef4444; }
  .stat .value.upcoming { color: #d97706; }
  .stat .sub { font-size: 12px; color: #999; margin-top: 2px; }

  .toolbar {
    background: white;
    padding: 14px 16px;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .toolbar input[type="search"] {
    flex: 1;
    min-width: 180px;
    padding: 8px 12px;
    border: 1px solid #d2d2d7;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .toolbar select {
    padding: 8px 10px;
    border: 1px solid #d2d2d7;
    border-radius: 6px;
    font-size: 14px;
    background: white;
    font-family: inherit;
  }
  .toolbar label {
    font-size: 13px;
    color: #333;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .table-wrap {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    overflow: hidden;
  }
  table.list {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.list th, table.list td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }
  table.list thead th {
    background: #fafafa;
    color: #555;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    position: sticky; top: 0;
  }
  table.list thead th:hover { background: #f0f0f0; }
  table.list thead th .arrow { color: #007aff; margin-left: 2px; }
  table.list tbody tr:hover { background: #fafbfc; }
  table.list tbody tr.inactive { opacity: 0.5; }
  table.list td.amount { font-family: 'SF Mono', Menlo, monospace; text-align: right; white-space: nowrap; }
  table.list td.jpy { font-family: 'SF Mono', Menlo, monospace; text-align: right; color: #666; white-space: nowrap; }
  table.list td.due-today { color: #ef4444; font-weight: 700; }
  table.list td.due-soon { color: #d97706; font-weight: 600; }
  table.list td.due-overdue { color: #7f1d1d; font-weight: 700; }
  table.list td .service { font-weight: 600; }
  table.list td .notes { font-size: 11px; color: #999; margin-top: 2px; }
  table.list td .days { display: block; font-size: 11px; color: #999; margin-top: 2px; font-weight: 400; }
  table.list td a { color: #007aff; text-decoration: none; }
  table.list td a:hover { text-decoration: underline; }
  .badge-cat {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    background: #eef1f4;
    color: #555;
    white-space: nowrap;
  }
  .badge-cat.AI { background: #e5f0ff; color: #007aff; }
  .badge-cat.動画配信 { background: #ffe5e5; color: #ef4444; }
  .badge-cat.業務ソフト { background: #e5fbe5; color: #16a34a; }
  .badge-cat.クラウド { background: #f0e5ff; color: #7c3aed; }
  .badge-cat.その他 { background: #fef3c7; color: #a16207; }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #999;
    font-size: 14px;
  }

  footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #e5e5e7;
    color: #888;
    font-size: 12px;
    text-align: center;
  }
  footer a { color: #007aff; text-decoration: none; }

  .callout {
    background: #fff9e5;
    border-left: 4px solid #f59e0b;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 16px;
    color: #78350f;
  }

  @media (max-width: 720px) {
    body { padding: 16px 10px; }
    table.list { font-size: 12px; }
    table.list th, table.list td { padding: 8px 6px; }
    .hide-mobile { display: none; }
    .stat .value { font-size: 20px; }
  }
</style>
</head>
<body>

<a class="back" href="./">← サブスクリプション管理システムに戻る</a>

<header>
  <h1>サブスクリプション一覧</h1>
  <div class="subtitle" id="subtitle">読み込み中…</div>
</header>

<div id="sample-warning" class="callout" style="display:none;">
  ⚠️ このページは <b>サンプルデータ</b> を表示しています。実データに置き換えるには
  <a href="https://github.com/atsumitanaka/apps/blob/main/subscription_manager/subscriptions.json" style="color:#78350f; text-decoration: underline;">subscriptions.json</a>
  を SharePoint のエクスポート内容で更新してください。
</div>

<div class="stats" id="stats">
  <div class="stat"><div class="label">有効な契約</div><div class="value" id="stat-active">-</div><div class="sub" id="stat-active-sub">-</div></div>
  <div class="stat"><div class="label">月額換算 (JPY)</div><div class="value" id="stat-monthly">-</div><div class="sub">全カテゴリ合計</div></div>
  <div class="stat"><div class="label">今日請求</div><div class="value due" id="stat-today">-</div><div class="sub" id="stat-today-sub">-</div></div>
  <div class="stat"><div class="label">7日以内</div><div class="value upcoming" id="stat-week">-</div><div class="sub" id="stat-week-sub">-</div></div>
</div>

<div class="toolbar">
  <input type="search" id="search" placeholder="サービス名 / 契約者 / メモ で検索…">
  <select id="filter-category">
    <option value="">すべてのカテゴリ</option>
    <option value="AI">AI</option>
    <option value="動画配信">動画配信</option>
    <option value="業務ソフト">業務ソフト</option>
    <option value="クラウド">クラウド</option>
    <option value="その他">その他</option>
  </select>
  <select id="filter-cycle">
    <option value="">すべての周期</option>
    <option value="月次">月次</option>
    <option value="年次">年次</option>
    <option value="四半期">四半期</option>
  </select>
  <label><input type="checkbox" id="filter-active" checked> 有効のみ</label>
</div>

<div class="table-wrap">
  <table class="list" id="list-table">
    <thead>
      <tr>
        <th data-sort="service">サービス <span class="arrow"></span></th>
        <th data-sort="amount" class="hide-mobile">金額 <span class="arrow"></span></th>
        <th data-sort="jpy">月額(JPY) <span class="arrow"></span></th>
        <th data-sort="billingCycle" class="hide-mobile">周期 <span class="arrow"></span></th>
        <th data-sort="nextBillingDate">次回請求 <span class="arrow">▲</span></th>
        <th data-sort="owner" class="hide-mobile">契約者 <span class="arrow"></span></th>
        <th data-sort="category">カテゴリ <span class="arrow"></span></th>
        <th class="hide-mobile">操作</th>
      </tr>
    </thead>
    <tbody id="list-body"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none;">該当するサブスクリプションはありません</div>
</div>

<footer>
  データソース: <a href="./subscriptions.json">subscriptions.json</a>
  &nbsp;|&nbsp;
  <a href="https://github.com/atsumitanaka/apps/tree/main/subscription_manager">GitHub</a>
</footer>

<script>
const state = {
  data: null,
  filtered: [],
  sortKey: 'nextBillingDate',
  sortAsc: true,
};

const $ = (id) => document.getElementById(id);
const today = () => {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
};

async function load() {
  try {
    const res = await fetch('./subscriptions.json?v=' + Date.now());
    if (!res.ok) throw new Error(res.statusText);
    state.data = await res.json();
    if (state.data.note) $('sample-warning').style.display = 'block';
    $('subtitle').textContent = `最終更新: ${state.data.lastUpdated} ・ 為替: 1 USD = ¥${state.data.fxRates.USD} / 1 EUR = ¥${state.data.fxRates.EUR}`;
    render();
  } catch (e) {
    $('subtitle').textContent = '読み込みに失敗しました: ' + e.message;
  }
}

function toJpyMonthly(sub) {
  const rate = state.data.fxRates[sub.currency] || 1;
  const jpy = sub.amount * rate;
  if (sub.billingCycle === '年次') return jpy / 12;
  if (sub.billingCycle === '四半期') return jpy / 3;
  return jpy;
}

function daysUntil(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const t = today();
  return Math.round((d - t) / 86400000);
}

function fmtJpy(n) {
  return '¥' + Math.round(n).toLocaleString();
}

function fmtAmount(n, currency) {
  if (currency === 'JPY') return n.toLocaleString();
  return n.toFixed(2);
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const cat = $('filter-category').value;
  const cyc = $('filter-cycle').value;
  const activeOnly = $('filter-active').checked;

  let rows = state.data.subscriptions.slice();
  if (activeOnly) rows = rows.filter(r => r.active);
  if (cat) rows = rows.filter(r => r.category === cat);
  if (cyc) rows = rows.filter(r => r.billingCycle === cyc);
  if (q) rows = rows.filter(r =>
    (r.service || '').toLowerCase().includes(q) ||
    (r.owner || '').toLowerCase().includes(q) ||
    (r.notes || '').toLowerCase().includes(q)
  );

  rows.forEach(r => r._jpy = toJpyMonthly(r));

  const key = state.sortKey;
  rows.sort((a, b) => {
    let va = key === 'jpy' ? a._jpy : a[key];
    let vb = key === 'jpy' ? b._jpy : b[key];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return state.sortAsc ? -1 : 1;
    if (va > vb) return state.sortAsc ? 1 : -1;
    return 0;
  });

  state.filtered = rows;
  renderStats();
  renderRows();
  renderSortArrows();
}

function renderStats() {
  const all = state.data.subscriptions.filter(r => r.active);
  const total = all.reduce((s, r) => s + toJpyMonthly(r), 0);
  const todayCount = all.filter(r => daysUntil(r.nextBillingDate) === 0);
  const weekCount = all.filter(r => { const d = daysUntil(r.nextBillingDate); return d > 0 && d <= 7; });

  $('stat-active').textContent = all.length;
  $('stat-active-sub').textContent = `全 ${state.data.subscriptions.length} 件のうち`;
  $('stat-monthly').textContent = fmtJpy(total);
  $('stat-today').textContent = todayCount.length;
  $('stat-today-sub').textContent = todayCount.length ? todayCount.map(r => r.service).join(' / ') : '本日の請求なし';
  $('stat-week').textContent = weekCount.length;
  $('stat-week-sub').textContent = weekCount.length ? `合計 ${fmtJpy(weekCount.reduce((s,r)=>s+toJpyMonthly(r),0))}` : 'なし';
}

function renderRows() {
  const body = $('list-body');
  body.innerHTML = '';
  if (state.filtered.length === 0) {
    $('empty').style.display = 'block';
    return;
  }
  $('empty').style.display = 'none';

  for (const r of state.filtered) {
    const tr = document.createElement('tr');
    if (!r.active) tr.classList.add('inactive');
    const d = daysUntil(r.nextBillingDate);
    let dueClass = '';
    let dueLabel = r.nextBillingDate;
    let daysLabel = '';
    if (d < 0) { dueClass = 'due-overdue'; daysLabel = `${-d}日前`; }
    else if (d === 0) { dueClass = 'due-today'; daysLabel = '今日'; }
    else if (d <= 7) { dueClass = 'due-soon'; daysLabel = `あと${d}日`; }
    else { daysLabel = `あと${d}日`; }

    tr.innerHTML = `
      <td>
        <div class="service">${escapeHtml(r.service)}</div>
        ${r.notes ? `<div class="notes">${escapeHtml(r.notes)}</div>` : ''}
      </td>
      <td class="amount hide-mobile">${fmtAmount(r.amount, r.currency)} ${r.currency}</td>
      <td class="jpy">${fmtJpy(r._jpy)}</td>
      <td class="hide-mobile">${escapeHtml(r.billingCycle)}</td>
      <td class="${dueClass}">${dueLabel}<span class="days">${daysLabel}</span></td>
      <td class="hide-mobile">${escapeHtml(r.owner || '')}</td>
      <td><span class="badge-cat ${escapeHtml(r.category || '')}">${escapeHtml(r.category || '-')}</span></td>
      <td class="hide-mobile">${r.cancelUrl ? `<a href="${escapeAttr(r.cancelUrl)}" target="_blank" rel="noopener">設定 ↗</a>` : ''}</td>
    `;
    body.appendChild(tr);
  }
}

function renderSortArrows() {
  document.querySelectorAll('th[data-sort]').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.sort === state.sortKey) {
      arrow.textContent = state.sortAsc ? '▲' : '▼';
    } else {
      arrow.textContent = '';
    }
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s);
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (state.sortKey === k) state.sortAsc = !state.sortAsc;
    else { state.sortKey = k; state.sortAsc = true; }
    render();
  });
});
['search', 'filter-category', 'filter-cycle', 'filter-active'].forEach(id => {
  $(id).addEventListener('input', render);
});

load();
</script>

</body>
</html>
